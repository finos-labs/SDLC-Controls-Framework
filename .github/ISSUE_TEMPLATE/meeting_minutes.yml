name: 🤝 SDLC Common Controls Catalog Meeting Minutes
description: To track SDLC Common Controls Catalog meeting agenda and attendance
title: "MMM DD YYYY - SDLC Common Controls Catalog Meeting Minutes"
labels: ["meeting"]
body:
  - type: markdown
    attributes:
      value: |
        # SDLC Common Controls Catalog Meeting
  - type: input
    id: date
    attributes:
      label: Date
      description: Meeting date and time
      placeholder: YYYYMMDD - 10am ET / 3pm GMT
    validations:
      required: true
  - type: textarea
    id: attendees
    attributes:
      label: Untracked attendees
      description: People who attended but are not already listed as project participants.
      value: |
        - Fullname, Affiliation, (optional) GitHub username
        - ...
      render: markdown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Meeting notices

        - FINOS **Project leads** are responsible for observing the FINOS guidelines for [running project meetings](https://community.finos.org/docs/governance/meeting-procedures/). Project maintainers can find additional resources in the [FINOS Maintainers Cheatsheet](https://community.finos.org/docs/finos-maintainers-cheatsheet).

        - **All participants** in FINOS project meetings are subject to the [LF Antitrust Policy](https://www.linuxfoundation.org/antitrust-policy/), the [FINOS Community Code of Conduct](https://community.finos.org/docs/governance/code-of-conduct) and all other [FINOS policies](https://community.finos.org/docs/governance/#policies).

        - FINOS meetings involve participation by industry competitors, and it is the intention of FINOS and the Linux Foundation to conduct all of its activities in accordance with applicable antitrust and competition laws. It is therefore extremely important that attendees adhere to meeting agendas, and be aware of, and not participate in, any activities that are prohibited under applicable US state, federal or foreign antitrust and competition laws. Please contact legal@finos.org with any questions.

        - FINOS project meetings may be recorded for use solely by the FINOS team for administration purposes. In very limited instances, and with explicit approval, recordings may be made more widely available.
  - type: checkboxes
    id: agenda
    attributes:
      label: Agenda
      options:
        - label: Convene & roll call (5mins)
        - label: Display [FINOS Antitrust Policy summary slide](https://community.finos.org/Compliance-Slides/Antitrust-Compliance-Slide.pdf)
        - label: Review Meeting Notices (see above)
        - label: Approve past meeting minutes
        - label: AOB, Q&A & Adjourn (5mins)
  - type: textarea
    id: additional-agenda
    attributes:
      label: Additional agenda items
      description: Add any extra agenda items for this meeting.
      value: |
        - [ ] Agenda item 1
        - [ ] Agenda item 2
      render: markdown
    validations:
      required: false
  - type: textarea
    id: decisions
    attributes:
      label: Decisions Made
      value: |
        - [ ] Decision 1
        - [ ] Decision 2
      render: markdown
    validations:
      required: false
  - type: textarea
    id: actions
    attributes:
      label: Action Items
      value: |
        - [ ] Action 1
        - [ ] Action 2
      render: markdown
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### Zoom info
        - [Zoom Meeting URL]({zoom-meeting-link})

